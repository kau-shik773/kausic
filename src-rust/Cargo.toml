[package]
name = "ytmusic-rust-engine"
version = "0.1.0"
edition = "2021"
description = "Native Rust Ad-Free YouTube Music Streaming and InnerTube Engine"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
futures-util = "0.3"
anyhow = "1.0"
regex = "1.10"
warp = "0.3"
